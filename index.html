<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OaxacaVive - Iniciar Sesión</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="login-pantalla">
        <form id="loginForm" class="login-formulario">
            <h1 class="login-logo">Oaxaca<span>Vive</span></h1>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div class="input-group">
                <label class="login-label">Correo electrónico (Usuario Dummy: emilys)</label>
                <input id="username" class="login-input" type="text" placeholder="ejemplo@gmail.com" required>
            </div>

            <div class="input-group">
                <label class="login-label">Contraseña (Pass: emilyspass)</label>
                <input id="password" class="login-input" type="password" placeholder="***********" required>
            </div>

            <button type="submit" class="login-boton" id="submitBtn">Ingresar</button>
        </form>
    </div>
    <script type="module" src="./js/login.js"></script>
</body>
</html>
